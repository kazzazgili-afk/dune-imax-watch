name: Poll Dune IMAX watch

on:
  schedule:
    # GitHub may delay or occasionally skip scheduled runs under high platform load -
    # this is a best-effort interval, not a guarantee.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

concurrency:
  group: dune-watch-poll
  cancel-in-progress: false   # never cancel a run that might be mid-commit

permissions:
  contents: write   # needed to commit the updated state file back to the repo

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run one poll cycle
        env:
          DUNE_WATCH_NTFY_TOPIC: ${{ secrets.DUNE_WATCH_NTFY_TOPIC }}
          DUNE_WATCH_SMTP_USER: ${{ secrets.DUNE_WATCH_SMTP_USER }}
          DUNE_WATCH_SMTP_PASS: ${{ secrets.DUNE_WATCH_SMTP_PASS }}
          DUNE_WATCH_IMAP_HOST: ${{ secrets.DUNE_WATCH_IMAP_HOST }}
          DUNE_WATCH_IMAP_PORT: ${{ secrets.DUNE_WATCH_IMAP_PORT }}
          DUNE_WATCH_IMAP_USER: ${{ secrets.DUNE_WATCH_IMAP_USER }}
          DUNE_WATCH_IMAP_PASS: ${{ secrets.DUNE_WATCH_IMAP_PASS }}
        run: python -m dune_watch run --once --config config/config.github.yaml

      - name: Commit updated state if it changed
        run: |
          git config user.name "dune-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Fast-forward to the current remote tip before diffing/committing, so a
            # commit from an overlapping run (e.g. a schedule tick landing close to a
            # manual dispatch) can't make this push land on a stale base.
            git fetch origin main
            git merge --ff-only origin/main
            git add state/github_state.db
            if git diff --cached --quiet; then
              echo "No state change to commit."
              exit 0
            fi
            git commit -m "chore: update poll state [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected on attempt $attempt, retrying..."
            git reset --soft HEAD~1
            sleep 3
          done
          echo "Failed to push state after retries." >&2
          exit 1
