# Config variant for running on GitHub Actions (headless, stateless runner).
# Differences from config.example.yaml:
#   - macos_native and auto_open_booking_link are disabled (no display/browser in CI)
#   - state db_path lives under state/ and is committed back to the repo each run by
#     the workflow (.github/workflows/poll.yml), since Actions runners don't persist
#     anything between runs on their own
#   - no secrets_file: credentials come from GitHub Actions Secrets as real env vars

film:
  title: "Dune: Part Three"
  keywords: ["dune", "dune: part three", "dune part 3"]
  format_keywords: ["imax 70mm", "70mm", "imax"]
  opening_window:
    # Global opening weekend is Fri 18 Dec 2026, but both London venues run previews
    # from Tue 15 Dec - a start of 2026-12-17 made html_page_diff discard those
    # preview showtimes as out of window. Keep the start early.
    start: "2026-12-01"
    end: "2027-02-28"

polling:
  default_interval_minutes: 20
  jitter_seconds: 90
  user_agent: "dune-imax-watch/0.1 (personal use; contact: kazzazgili@gmail.com)"
  http_timeout_seconds: 15
  http_max_retries: 2
  # No hot window here: GitHub's schedule is ~20 min at best, so a fast cadence is
  # meaningless. This deployment is the independent backup; the VM is primary.
  heartbeat_stale_after_minutes: 0   # CI is stateless per run - the VM owns the heartbeat
  failing_source_alert_after_cycles: 6
  batch_threshold: 3

venues:
  - id: science_museum_imax
    name: "Science Museum IMAX (The Ronson Theatre)"
    enabled: false   # sciencemuseum.org.uk returns 403 to GitHub Actions' IP ranges
    # specifically (confirmed - works fine from a home IP, e.g. via the launchd
    # deployment). Rather than work around that block, this venue is covered on
    # GitHub via the email-alert venue below instead. Kept here, disabled, in case
    # the block is ever lifted and direct polling becomes viable again from CI.
    venue_type: html_page_diff
    url: "https://www.sciencemuseum.org.uk/see-and-do/dune-part-three"
    poll_interval_minutes: 20
    parser_hints:
      register_interest_markers: ["register your interest", "register interest"]
      showtime_container_selector: ".showtime, .performance, [data-showtime]"

  - id: science_museum_imax_email
    name: "Science Museum IMAX (Email Alert)"
    enabled: true
    venue_type: imap_newsletter
    poll_interval_minutes: 60
    imap:
      folder: "INBOX"
      # CONFIRMED sender (9 Sept 2026 on-sale email): no-reply@sciencemuseum.ac.uk
      # Note the .ac.uk - the original ".org.uk" filter is a substring test that never
      # matched, and it silently dropped the museum's only ticket release to date.
      sender_filter: ["sciencemuseum.ac.uk", "sciencemuseum.org.uk"]
      subject_keywords: ["imax", "dune", "on sale", "tickets", "ronson"]
      lookback_days_on_first_run: 30

  - id: bfi_imax
    name: "BFI IMAX (Southbank)"
    enabled: true
    venue_type: imap_newsletter
    poll_interval_minutes: 60
    imap:
      folder: "INBOX"
      # CONFIRMED sender (8 Sept 2026 Dune preview email): noreply@news.bfi.org.uk.
      # Must be a bare domain fragment: "news@bfi.org.uk" is NOT a substring of
      # "noreply@news.bfi.org.uk", so the old filter never matched either.
      sender_filter: ["bfi.org.uk"]
      subject_keywords: ["imax", "dune", "on sale", "tickets"]
      lookback_days_on_first_run: 30

  - id: science_museum_bluesky
    name: "Science Museum IMAX (Bluesky)"
    enabled: true
    venue_type: bluesky_feed
    poll_interval_minutes: 20
    bluesky:
      actor: "did:plc:vfz6n4by6ayu2ybwpq6qemik"
      limit: 30
    # Bluesky's public API is reachable from GitHub Actions (unlike sciencemuseum.org.uk,
    # which 403s CI IP ranges), so this gives CI a second independent signal beyond email.

state:
  db_path: "./state/github_state.db"   # tracked in git, committed by the workflow when it changes

notifications:
  channels:
    macos_native:
      enabled: false   # no display on a GitHub Actions runner
    ntfy:
      enabled: true
      topic_env_var: "DUNE_WATCH_NTFY_TOPIC"
      server: "https://ntfy.sh"
    email_smtp:
      enabled: true
      smtp_host: "smtp.gmail.com"
      smtp_port: 587
      use_tls: true
      username_env_var: "DUNE_WATCH_SMTP_USER"
      password_env_var: "DUNE_WATCH_SMTP_PASS"
      from_addr: "kazzazgili@gmail.com"
      to_addrs: ["kazzazgili@gmail.com"]
  # One "still watching" notification per day, so you can tell a healthy-but-quiet
  # watcher apart from a dead one. Fires on the first poll cycle of each calendar day
  # at or after not_before_hour - deliberately not at a fixed time, because GitHub
  # Actions throttles scheduled runs to roughly every 4 hours with gaps up to 8.
  # Always INFO, so it never triggers the urgent ntfy priority, the repeat nudges or
  # the browser auto-open that a real on-sale does.
  daily_status:
    # ON here: this is the only deployment that runs without the laptop being awake.
    # GitHub throttles scheduled runs to ~6/day with gaps up to 8 hours, which is far
    # too coarse for polling but perfectly adequate for a once-a-day report - the ping
    # fires on the first qualifying run of each calendar day, whenever that lands.
    enabled: true
    timezone: "Asia/Jerusalem"
    not_before_hour: 9
  auto_open_booking_link:
    enabled: false   # no browser on a GitHub Actions runner
    min_urgency: "HIGH"
